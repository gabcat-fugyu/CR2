name: クラロワ戦績を収集

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
  push:
    paths:
      - "players.json"

permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 戦績を取得
        env:
          CR_API_TOKEN: ${{ secrets.CR_API_TOKEN }}
        run: python collect.py
      - name: 変更があればcommit
        run: |
          git config user.name "cr-collector"
          git config user.email "actions@github.com"
          git add data/
          if git diff --staged --quiet; then
            echo "更新なし"
          else
            git commit -m "戦績を更新 $(date -u '+%Y-%m-%d %H:%M UTC')"
            git push
          fi
