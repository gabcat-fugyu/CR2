name: クラロワ戦績を収集

# GitHubの schedule は起動時刻が保証されず、混雑時は30分〜1時間ずれる。
# そこで「起動は30分おき / 起動したら中で5分おきに6回まわす」形にして、
# 実際の収集間隔を5分に保つ。
# (公開リポジトリは Actions の実行時間が無制限なので長く回しても無料)
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch: # 手動実行。押すと1回だけ取得する
  push:
    paths:
      - "players.json" # 追跡する人を変えたら即座に反映する

permissions:
  contents: write

# 走っている途中に次が始まらないようにする。待たせる方(キャンセルしない)
concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 5分おきに収集する
        env:
          CR_API_TOKEN: ${{ secrets.CR_API_TOKEN }}
          # 定期起動なら6回まわす。手動やplayers.json更新なら1回だけ
          LOOPS: ${{ github.event_name == 'schedule' && '6' || '1' }}
        run: |
          git config user.name "cr-collector"
          git config user.email "actions@github.com"

          for i in $(seq 1 "$LOOPS"); do
            echo "===== $i / $LOOPS 回目 ====="
            python collect.py

            git add data/
            if git diff --staged --quiet; then
              echo "更新なし"
            else
              git commit -m "戦績を更新 $(date -u '+%Y-%m-%d %H:%M UTC')"
              # 他の実行とぶつかっても落ちないように、取り込んでから送る
              git pull --rebase --autostash origin main
              git push
            fi

            # 最後の回は待たずに終わる
            if [ "$i" -lt "$LOOPS" ]; then
              sleep 300
            fi
          done
