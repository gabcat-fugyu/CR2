name: クラロワ戦績を収集

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
  push:
    paths:
      - "players.json"

permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 5分おきに収集する
        env:
          CR_API_TOKEN: ${{ secrets.CR_API_TOKEN }}
          EVENT: ${{ github.event_name }}
        run: |
          git config user.name "cr-collector"
          git config user.email "actions@github.com"

          # 定期起動なら6回、手動などは1回だけ
          if [ "$EVENT" = "schedule" ]; then LOOPS=6; else LOOPS=1; fi

          for i in $(seq 1 "$LOOPS"); do
            echo "===== $i / $LOOPS 回目 ====="
            python collect.py

            git add data/
            if git diff --staged --quiet; then
              echo "更新なし"
            else
              git commit -m "戦績を更新 $(date -u '+%Y-%m-%d %H:%M UTC')"
              git pull --rebase --autostash origin main
              git push
            fi

            if [ "$i" -lt "$LOOPS" ]; then
              sleep 300
            fi
          done
