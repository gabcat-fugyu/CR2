name: クラロワ戦績を収集

# GitHubの schedule は起動時刻が保証されず、混雑時は遅延する。
# 凝った作りにすると壊れやすいので、素直に10分おきにしておく。
# 公式APIは直近25試合を保持しているので、多少空いても取りこぼしはまず起きない。
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch: # 手動実行用のボタンを出す
  push:
    paths:
      - "players.json" # 追跡する人を変えたら即座に反映する

# リポジトリへの書き込みを許可する (収集結果をcommitするため)
permissions:
  contents: write

# 前回の実行が終わる前に次が始まらないようにする
concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 戦績を取得
        env:
          CR_API_TOKEN: ${{ secrets.CR_API_TOKEN }}
        run: python collect.py

      - name: 変更があればcommit
        run: |
          git config user.name "cr-collector"
          git config user.email "actions@github.com"
          git add data/
          # 差分が無い場合は commit せずに正常終了させる
          if git diff --staged --quiet; then
            echo "更新なし"
          else
            git commit -m "戦績を更新 $(date -u '+%Y-%m-%d %H:%M UTC')"
            # 手動編集などとぶつかっても落ちないように、取り込んでから送る
            git pull --rebase --autostash origin main
            git push
          fi
